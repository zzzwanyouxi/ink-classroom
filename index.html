<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>课堂手写笔记</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <nav id="rail">
    <button class="rail-btn on" data-rail="home" title="笔记">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M6 3.5h8.5L20 9v11.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z"/>
        <path d="M14 3.5V9h6"/>
      </svg>
    </button>

    <button class="rail-btn" data-rail="help" title="快捷键">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 17.5v.01"/>
        <path d="M9.5 9a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1 1-1.1 1.8v.8"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
    </button>
    <div class="rail-grow"></div>
    <button class="rail-btn" data-rail="info" title="关于">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 11v6"/>
        <path d="M12 7.5v.01"/>
      </svg>
    </button>
  </nav>

  <aside id="side">
    <div class="side-top">
      <span class="app-name">课堂笔记</span>
      <button id="newFolderBtn" class="icon-btn" title="新建文件夹">＋</button>
    </div>
    <div class="side-search">
      <input id="searchInput" placeholder="搜索页面" />
    </div>
    <div id="tree" class="tree"></div>
    <div class="side-foot">
      <span class="foot-link" id="wsBtn" title="选一个文件夹，笔记自动存进去">存文件夹</span>
      <span id="wsStatus" class="foot-note">浏览器存储</span>
      <span class="foot-link" id="helpBtn">快捷键</span>
    </div>
  </aside>

  <div id="sideResizer" title="拖动调整宽度 / 拖到最左收起"></div>

  <main id="main">
    <div id="ribbonHot" title="移到顶部显示工具栏"></div>
    <nav id="ribbon">
      <div class="group" id="penGroup"></div>
      <div class="sep"></div>
      <div class="group" id="colorGroup"></div>
      <div class="sep"></div>
      <div class="group" id="widthGroup"></div>
      <div class="sep"></div>
      <div class="group" id="toolGroup">
        <button class="act" data-tool="eraser" title="橡皮（E）">橡皮</button>
        <button class="act" data-tool="lasso" title="套索选择（L）">套索</button>
        <button class="act" data-tool="marquee" title="框选（M）：拖一个矩形批量选中">框选</button>
        <button class="act" data-tool="ruler" title="直尺（R）">直尺</button>
        <button class="act" id="shapeBtn" title="形状识别">形状</button>
      </div>
      <div class="sep"></div>
      <button class="act" id="undoBtn" title="撤销（Ctrl+Z）">↶</button>
      <button class="act" id="redoBtn" title="重做（Ctrl+Shift+Z）">↷</button>
      <button class="act" id="replayBtn" title="墨迹重播">重播</button>
      <div class="grow"></div>
      <button class="ghost" id="importBtn" title="导入 PDF / Word / 图片">导入</button>
      <button class="ghost" id="docBtn" title="收起/展开左侧原卷">原卷</button>
      <button class="ghost" id="exportBtn" title="导出当前草稿 PNG">导出</button>
      <button class="ghost" id="pinBtn" title="固定工具栏（H）">固定</button>
      <button class="ghost" id="fullBtn" title="全屏（F）：任务栏不再弹出，面板保留">全屏</button>
      <button class="primary" id="presentBtn" title="投影模式（P）">投影</button>
    </nav>

    <div id="body">
      <aside id="docpane">
        <div class="pane-head">
          <span class="ph-label">原卷</span>
          <span id="docname" class="ph-name"></span>
          <div class="grow"></div>
          <button id="syncBtn" class="mini-btn" title="左右同步滚动">同步</button>
          <button id="docZoomOut" class="mini-btn" title="缩小">−</button>
          <button id="docZoomIn" class="mini-btn" title="放大">＋</button>
        </div>
        <div id="docbody">
          <div id="docScroll">
            <div id="docPages"></div>
            <div id="docEmpty">
              <div class="de-title">左侧放原卷</div>
              <div class="de-sub">把 PDF / 图片 拖到这里，左右都能写</div>
            </div>
          </div>
          <canvas id="docInk"></canvas>
          <div id="docCursor"></div>
        </div>
      </aside>

      <div id="splitter" title="拖动调整宽度"></div>

      <section id="notepane">
        <canvas id="bg"></canvas>
        <canvas id="live"></canvas>
        <div id="noteScroll"><div id="noteSpacer"></div></div>
        <div id="penCursor"></div>
        <div id="emptyhint">右边无限向下，写满自动加长<br><small>拖入 PDF / 图片放左边当原卷</small></div>
        <div id="selbar">
          <button data-act="left" title="左对齐">左</button>
          <button data-act="hcenter" title="水平居中">中</button>
          <button data-act="right" title="右对齐">右</button>
          <span class="ssep"></span>
          <button data-act="top" title="顶端对齐">上</button>
          <button data-act="vcenter" title="垂直居中">中</button>
          <button data-act="bottom" title="底端对齐">下</button>
          <span class="ssep"></span>
          <button data-act="disth" title="水平等距分布">横等距</button>
          <button data-act="distv" title="垂直等距分布">竖等距</button>
          <span class="ssep"></span>
          <button data-act="rotate" title="旋转 90 度">转90</button>
          <button data-act="copy" title="复制 (Ctrl+C)">复制</button>
          <button data-act="delete" title="删除 (Delete)">删除</button>
        </div>
        <div id="zoomPill">
          <button id="zoomOut" title="缩小">−</button>
          <button id="zoomLabel" title="恢复适应宽度">100%</button>
          <button id="zoomIn" title="放大">＋</button>
        </div>
      </section>
    </div>
  </main>
</div>

<div id="dropmask"><div>松开导入　PDF / Word / 图片</div></div>
<input id="fileInput" type="file" multiple accept=".pdf,.docx,.doc,image/*" hidden />
<div id="toast"></div>

<script src="vendor/pdf.min.js"></script>
<script src="import.js"></script>
<script src="app.js"></script>
</body>
</html>
